<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Content Filter</title>
    <link rel="stylesheet" href="style.css" />
  </head>
  <body>
    <main class="popup">
      <section class="hero-card">
        <header class="header header-logo-only">
          <div class="brand-lockup">
            <img src="assets/logo-full.png" alt="Content Filter" class="brand-logo" />
          </div>
        </header>

        <p class="subtitle">Block unwanted videos &amp; posts</p>

        <form id="keyword-form" class="keyword-form">
          <div class="input-shell">
            <input
              id="keyword-input"
              type="text"
              placeholder="Enter keyword..."
              autocomplete="off"
            />
            <button type="submit" id="add-keyword-btn">
              <span class="button-icon" aria-hidden="true">+</span>
              <span>Add</span>
            </button>
          </div>
        </form>
      </section>

      <section class="keywords-card">
        <div class="section-head">
          <span class="section-label">Active Filters</span>
          <span class="section-count">Keyword rules</span>
        </div>

        <ul id="keyword-list" class="keyword-list"></ul>
        <p id="empty-state" class="empty-state">No filters added yet</p>
      </section>

      <footer class="footer-card">
        <div class="footer-copy">
          <span class="footer-title">Smart filtering enabled</span>
          <span class="footer-subtitle">Auto-scans your Facebook feed in real time</span>
        </div>

        <label class="toggle" aria-label="Smart filtering enabled">
          <input type="checkbox" checked />
          <span class="toggle-slider"></span>
        </label>
      </footer>
    </main>

    <script src="popup.js"></script>
  </body>
</html>
